name: Generate contribution snake

on:
  # rebuild every 12 hours so new contributions show up
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # also runs when you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake images
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6B2F5E&color_dots=#F6EAF2,#FFD6E7,#F4A6C0,#E8789F,#B0558A
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD6E7&color_dots=#2A1B2A,#5B2A4A,#8B3A6E,#C45B93,#F4A6C0

      - name: Publish the images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
